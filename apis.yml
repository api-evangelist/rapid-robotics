x-enrichment-note: 'Enrichment probe 2026-08-26. Rapid Robotics is defunct: its assets were acquired by
  RobCo (all/robco, https://www.rob.co/) ahead of RobCo''s 2025-09-09 US launch announcement, which states
  RobCo spent eight months "acquiring the assets of the US firm, Rapid Robotics, including hardware, marquee
  customers, and an experienced local team". The domain is gone: rapidrobotics.com now delegates to
  ns1.atom.com/ns2.atom.com and https://www.rapidrobotics.com/ returns HTTP 302 to
  https://www.atom.com/name/RapidRobotics, a brand-name/domain marketplace listing (atom.com itself answers
  403 behind a Cloudflare challenge to non-browser clients). No api./docs./developer./app. subdomain
  resolves in DNS. STEP 0b contract discovery ran in full against www.rapidrobotics.com and every path
  returned HTTP 404 from the parking origin (openresty), with no soft-200 catch-all: /openapi.json,
  /swagger.json, /api-docs, /docs, /llms.txt, /.well-known/security.txt, /.well-known/agent-card.json,
  /.well-known/agent.json, /.well-known/api-catalog, /.well-known/openid-configuration,
  /.well-known/oauth-authorization-server, /.well-known/ai-plugin.json. No GraphQL or MCP surface was ever
  advertised, so there was nothing to introspect. A Wayback CDX sweep of the historical site returned 1,773
  unique URLs (last live capture 2026-07-01) covering only marketing paths — /about, /blog, /capabilities,
  /careers, /company, /contact, /events, /faqs, /use-cases — and ZERO developer paths; the company shipped
  RaaS hardware operated through its own console, not an API. No GitHub organization exists at
  github.com/rapid-robotics, /rapidrobotics or /RapidRobotics (GitHub API 403/absent). Retrieval of archived
  page BODIES from web.archive.org timed out and was abandoned per the bounded-probe rule (the CDX index
  answered fine); this affects narrative colour only, not the finding. REMOVED a false Website pointer to
  https://www.nasdaqprivatemarket.com/ that the harvest stub carried: that is the secondary-market VENUE the
  company was surfaced from, not Rapid Robotics'' own site. No replacement Website pointer was added because
  the company no longer serves one. Domain-security, well-known, packages and llms artifacts were all
  deliberately NOT written: probing the parked domain would have recorded Atom.com''s marketplace posture and
  credited it to Rapid Robotics. Zero artifacts written; any would be fabrication.'
